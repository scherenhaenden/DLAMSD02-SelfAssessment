# SwiftLint configuration for AssessYourself (DLAMSD02)
# Configured for modern SwiftUI, strict domain invariants, and academic code quality.

disabled_rules:
  - multiple_closures_with_trailing_closure # Idiomatic in SwiftUI (e.g. Button label + action, confirmationDialog)
  - trailing_comma # Clean multi-line parameter lists
  - empty_count # Produces false positives on XCUIElementQuery and integer properties named count
  - line_length # Handled cleanly by soft wrap and code style
  - function_body_length # Declarative SwiftUI bodies and evaluation logic
  - type_body_length # SwiftUI views with multiple sections and subcomponents
  - cyclomatic_complexity # Comprehensive domain validations

opt_in_rules:
  - fatal_error_message
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

included:
  - src
  - ui-tests

excluded:
  - .build
  - DerivedData
  - AssessYourself.xcodeproj
  - scripts

file_length:
  warning: 1000
  error: 1500

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - vm
    - q
    - q1
    - q2
    - to
    - in
    - r
    - g
    - b
    - i
    - c

reporter: "xcode"
